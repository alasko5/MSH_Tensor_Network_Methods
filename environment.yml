# Python environment for the Python/kwant notebooks (msh_chain_python_ed, tjunctions_python_ed and the two
# compare notebooks). Versions are those the saved outputs were produced with (numba: 0.68.0rc1 was used).
#   conda env create -f environment.yml
#   conda activate msh-tn
name: msh-tn
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.3.5
  - scipy=1.16.3
  - matplotlib=3.10.6
  - kwant=1.5.0
  - numba>=0.62
  - ipywidgets=8.1
  - tqdm
  - ipykernel
  - jupyterlab
